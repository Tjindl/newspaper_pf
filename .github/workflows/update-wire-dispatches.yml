name: Update Wire Dispatches

on:
  schedule:
    # Daily, ~06:17 Pacific (13:17 UTC) — off the hour to avoid GitHub's
    # scheduled-workflow traffic spikes at :00.
    - cron: "17 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest PR data from GitHub
        run: node scripts/update-wire-dispatches.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if data changed
        run: |
          if git diff --quiet -- data/wire-dispatches.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wire-dispatches.json
          git commit -m "chore: refresh wire dispatches from GitHub PRs"
          git push
